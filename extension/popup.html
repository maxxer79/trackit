<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="popup">
    <div class="row" style="justify-content: space-between;">
      <h1>Track this item</h1>
      <span class="pill" id="who"></span>
    </div>

    <!-- Not configured yet -->
    <div id="setup" hidden>
      <p class="sub">Connect this extension to your Trackit instance to start tracking pages.</p>
      <button id="openOptions">Set up the extension</button>
    </div>

    <!-- Ready -->
    <div id="ready" hidden>
      <p class="sub">Send this page to Trackit. It'll auto-detect the store and pull in the product details.</p>
      <div class="url" id="url"></div>
      <button id="track">Track this item</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
