version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# TrackIt — Production Stack
#
# This file matches what actually runs on the NAS (project name: trackit):
#   • service `db` (Postgres 15), database name `trackit`, user `trackit`
#   • network `trackit_default`
#   • frontend published on host port 2000 (Caddy → 192.168.200.68:2000)
#   • nightly DB backups written to /volume1/docker/trackit/backups
#
# Images are built by GitHub Actions and published to:
#   ghcr.io/maxxer79/trackit-backend:latest
#   ghcr.io/maxxer79/trackit-frontend:latest
#
# Provide the environment variables from .env (see .env.example).
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trackit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackit -d trackit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FlareSolverr (Cloudflare challenge solver) ──────────────────────────────
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: America/New_York

  # ─── Backend API ─────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/maxxer79/trackit-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://trackit:${POSTGRES_PASSWORD}@db:5432/trackit
      # Discrete Redis vars — REDIS_URL breaks if the password contains @ : / # ?
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      FLARESOLVERR_URL: http://flaresolverr:8191
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_EMAIL: ${VAPID_EMAIL}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM:-TrackIt <noreply@trackit.io>}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      SCRAPER_INTERVAL_MINUTES: ${SCRAPER_INTERVAL_MINUTES:-5}
      SCRAPER_CONCURRENCY: ${SCRAPER_CONCURRENCY:-5}
      # Min ms between requests to the SAME retailer (per-store pacing); 0 disables.
      SCRAPER_MIN_INTERVAL_MS: ${SCRAPER_MIN_INTERVAL_MS:-1200}
      # Retention windows (days) for housekeeping; 0 disables that table's pruning.
      SCRAPER_LOG_RETENTION_DAYS: ${SCRAPER_LOG_RETENTION_DAYS:-30}
      STOCK_EVENT_RETENTION_DAYS: ${STOCK_EVENT_RETENTION_DAYS:-365}
      # Database backups (admin panel + nightly cron). Dumps land in the mounted
      # volume below; keep the newest BACKUP_RETENTION.
      BACKUP_DIR: /backups
      BACKUP_RETENTION: "30"
      BACKUP_CRON: "0 3 * * *"
    volumes:
      # Host path is NAS-specific; must be writable by the container user (uid 1001).
      - /volume1/docker/trackit/backups:/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ─── Frontend (nginx) ─────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/maxxer79/trackit-frontend:latest
    restart: unless-stopped
    ports:
      - "2000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: trackit_default
