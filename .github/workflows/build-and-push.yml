name: CI — Test, Build & Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/trackit-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/trackit-frontend

jobs:
  # ─── Lint / typecheck / tests ──────────────────────────────────────────────
  # Fast feedback on PRs (and before any image is built on main). Uses
  # `npm install` because no lockfile is committed yet (Dockerfiles do the same).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # matches the node:20-alpine runtime

      # ── Backend: tests + typecheck ──
      - name: Backend — install
        working-directory: backend
        run: npm install
      - name: Backend — generate Prisma client (needed for typecheck)
        working-directory: backend
        run: npx prisma generate
      - name: Backend — tests
        working-directory: backend
        run: npm test
      - name: Backend — typecheck
        working-directory: backend
        run: npx tsc --noEmit

      # ── Frontend: lint + typecheck ──
      - name: Frontend — install
        working-directory: frontend
        run: npm install
      # Advisory for now: lint uses --max-warnings 0, so pre-existing warnings
      # would otherwise block the gated build. Flip to blocking (remove
      # continue-on-error) once the existing warnings are cleaned up.
      - name: Frontend — lint (advisory)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint
      - name: Frontend — typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  # ─── Build & push images (only after tests pass; never on PRs) ──────────────
  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ─── Backend ─────────────────────────────────────────────────────────────
      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          # Context is the repo root so the build can see ./shared alongside
          # ./backend; the Dockerfile path is given explicitly.
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          # ignore-error: a flaky GitHub cache write ("error writing layer
          # blob: not_found") must not fail the build after the image already
          # pushed — that was aborting the job before the frontend built.
          cache-to: type=gha,mode=max,ignore-error=true

      # ─── Frontend ────────────────────────────────────────────────────────────
      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          # Context is the repo root so the build can see ./shared alongside
          # ./frontend; the Dockerfile path is given explicitly.
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_VAPID_PUBLIC_KEY=${{ vars.VITE_VAPID_PUBLIC_KEY }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Summary
        run: |
          echo "### ✅ Images published" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.BACKEND_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.FRONTEND_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deploy by restarting the Portainer stack." >> $GITHUB_STEP_SUMMARY
