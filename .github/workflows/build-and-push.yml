name: Build & Push Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/trackit-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/trackit-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── Backend ─────────────────────────────────────────────────────────────
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          # Context is the repo root so the build can see ./shared alongside
          # ./backend; the Dockerfile path is given explicitly.
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          # ignore-error: a flaky GitHub cache write ("error writing layer
          # blob: not_found") must not fail the build after the image already
          # pushed — that was aborting the job before the frontend built.
          cache-to: type=gha,mode=max,ignore-error=true

      # ─── Frontend ────────────────────────────────────────────────────────────
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          # Context is the repo root so the build can see ./shared alongside
          # ./frontend; the Dockerfile path is given explicitly.
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_VAPID_PUBLIC_KEY=${{ vars.VITE_VAPID_PUBLIC_KEY }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Summary
        run: |
          echo "### ✅ Images published" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.BACKEND_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.FRONTEND_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deploy by restarting the Portainer stack." >> $GITHUB_STEP_SUMMARY
